    <title>Groundtrack: IBM Bob wrote a spacecraft fault detector, and a grader it could not touch proved it worked</title>
    <meta
      name="description"
      content="IBM Bob wrote every line of a fault detector for NASA spacecraft telemetry. A grading script written before the detector existed, and which Bob cannot edit, scored each revision on 26 recordings Bob never saw. False alarms fell from 128 to 7."
    />
    <meta property="og:title" content="IBM Bob wrote a spacecraft fault detector. A grader it could not touch proved it worked." />
    <meta
      property="og:description"
      content="Every line of the detector is authored by IBM Bob. False alarms on unseen NASA telemetry fell from 128 to 7, and the benchmark score went from 0.266 to 0.623."
    />

  <body>
    <!--
      The page has one job: someone who knows nothing about this project should
      understand what they are looking at within ten seconds, and should be able
      to watch the whole story without touching a control.
      So the centrepiece is a player, not a dashboard. It starts on the first
      detector the agent wrote, advances by itself, and redraws the same
      recording at each step so a change is visible as a change. Play, pause and
      step controls are always there; autoplay is the default and never a trap.
      Colour carries meaning and lives inside the plot: amber is a fault that
      really happened, green is an alarm with one under it, red is an alarm with
      nothing there. Both axes are named in words. Every number on screen is read
      from data regenerated from the repository, and the exporter refuses to
      build a picture of a version of the detector that does not score exactly
      what the record says it scored.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
